<script src="./includeInIFrame.js"></script>
<script>
import mongoose from "mongoose"; 

await mongoose.connect(
    uri: `mongodb://${process.env.MONGODB_HOST}:${process.env.MONGODB_PORT}/${process.env.MONGODB_DB}`, 
    { 
        auth: { 
            username: process.env.MONGODB_USER, 
            password: process.env.MONGODB_PASSWORD 
        } 
    }
);
// Alternative : les credentials peuvent être intégrés à l'URI de connexion
// Par exemple : mongodb://username:password@server:port/nomDeLaBase

</script>
