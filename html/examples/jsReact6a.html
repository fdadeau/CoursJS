<head>
    <meta charset="UTF-8">
    <title>sort</title>
<style>

<script src="./includeInIFrame.js"></script>
<script>
import { useEffect, useState } from "react"; 

function Stops() { 
    const [stops, setStops] = useState([]); 

    useEffect(() => { 
        fetch("/api/stops") 
        .then(r => r.json()) 
        .then(data => setStops(data)); 
    }, []); 

    return <StopList stops={stops} />;   // StopList est un composant décrit précédemment
}
</script>
</head>
