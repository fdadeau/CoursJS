<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>new Object</title>
<style>
</style>
<script src="./includeInIFrame.js"></script>
</head>

<body>
<noscript>
function App() {
  const [page, setPage] = useState("home");

  return (
    <>
      <nav>
        <button onClick={() => setPage("home")}>Accueil</button>
        <button onClick={() => setPage("profile")}>Profile</button>
        <button onClick={() => setPage("about")}>À propos</button>
      </nav>

      {page === "home" && <Home />}
      {page === "profile" && <Profile />}
      {page === "about" && <About />}
    </>
  );
}</noscript>
</body>

</html>
