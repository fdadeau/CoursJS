async function fetchWithToken(url, options = {}) {
  const token = getAccessToken() // récupération de l'access token

  const headers = {
    ...options.headers,
    Authorization: `Bearer ${token}`
  };

  return fetch(url, {
    ...options,
    headers
  });
}
