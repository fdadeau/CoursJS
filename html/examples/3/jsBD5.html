router.get("/stops/:id", async (req, res) => { 
    try { 
        const [rows] = await pool.query( 
            "SELECT * FROM stops WHERE id = ?", 
            [req.params.id] 
        ); 
        if (rows.length === 0) { 
            return res.status(404).json({ error: "Arrêt introuvable" }); 
        } 
        res.json(rows[0]); 
    } 
    catch (error) { 
        console.error(error); 
        res.status(500).json({ error: "Erreur lors de l'accès aux données" }); 
    } 
});
</noscript>
