    <title>Node.js</title>

<body>
<noscript>
import express from 'express';
import { createServer } from 'http';
import { Server } from 'socket.io';

const app = express();
const server = createServer(app);

const io = new Server(server);

// Quand un client se connecte, on le note dans la console
io.on('connection', function (socket) {
    // envoi à tous les clients connectés (y compris le client courant)
    io.emit("info", "Un client vient de se connecter.");
    
    let isFred = false;

    // réception d'un message "login" (interne à l'appli)
    socket.on("login", function(msg) {
        if (msg.id == "freddadeau" && msg.password == "1234") {
            isFred = true;
            // envoi à ce client
            socket.emit("bienvenue", "Salut Fred ! Je t'attendais");
            // envoi à tous sauf au client courant 
            socket.broadcast.emit("info", "Fred Dadeau vient de s'identifier");
        }
    });
    
    // réception d'un message "disconnect" ()
    socket.on("disconnect", function(reason) { 
        socket.broadcast.emit("Un client est parti...");
        if (isFred) {
            socket.broadcast.emit("En plus, c'était Fred.");
        }
    });
    // ... autres traitements/messages
});
    
server.listen(8080);
</noscript>
</body>

</html>
