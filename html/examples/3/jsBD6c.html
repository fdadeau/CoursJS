export async function getStop(req, res) { 
    try { 
        const stop = await findStopById(req.params.id); 
        if (!stop) { 
            return res.status(404)
                      .json({ error: "Arrêt introuvable" }); 
        } 
        res.json(stop); 
    } 
    catch (error) { 
        res.status(500).json({ error: "Erreur interne" }); 
    } 
}
