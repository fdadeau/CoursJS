<script src="./includeInIFrame.js"></script>
<script>
app.post('/api/refresh', (req, res) => {

    const refreshToken = getRefreshToken(req) // Récupération du token dans la requête HTTP

    if (!refreshToken) {
        return res.status(401).json({ error: 'Refresh token manquant dans les en-têtes.' });
    }

    jwt.verify(refreshToken, process.env.JWT_REFRESH_SECRET, (err, decoded) => {
        if (err) {
            return res.status(403).json({ error: 'Refresh token invalide ou expiré.' });
        }
        const newAccessToken = jwt.sign(
            { sub: decoded.sub, roles: decoded.roles }, // champs repris du payload décodé
            JWT_SECRET,
            { expiresIn: '15m' }
        );
        return res.status(200).json({ accessToken: newAccessToken });
    });
});
</script>
</head>
